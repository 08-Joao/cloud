version: '3.8'

services:
  cloud_postgres:
    container_name: cloud_postgres
    image: docker.io/library/postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-cloud_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-cloud_password}
      - POSTGRES_DB=${POSTGRES_DB:-cloud_db}
    volumes:
      - cloud_postgres_data:/var/lib/postgresql/data
    restart: always
    networks:
      - cloud_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 5

  cloud_backend:
    container_name: cloud_backend
    image: docker.io/${DOCKER_USER}/cloud-backend:latest
    environment:
      - NODE_ENV=production
      - PORT=4002
      - DATABASE_URL=${DATABASE_URL}
      - AUTH_API_URL=${AUTH_API_URL}
      - B2_APPLICATION_KEY_ID=${B2_APPLICATION_KEY_ID}
      - B2_APPLICATION_KEY=${B2_APPLICATION_KEY}
      - B2_BUCKET_NAME=${B2_BUCKET_NAME}
      - B2_ENDPOINT=${B2_ENDPOINT}
      - DOWNLOAD_TOKEN_SECRET=${DOWNLOAD_TOKEN_SECRET}
    volumes:
      - cloud_uploads:/app/uploads
    depends_on:
      cloud_postgres:
        condition: service_healthy
    restart: always
    networks:
      - cloud_network
      - proxy_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.cloud-backend.rule=Host(`api.cloud.tehkly.com`)"
      - "traefik.http.routers.cloud-backend.entrypoints=websecure"
      - "traefik.http.routers.cloud-backend.tls.certresolver=le"
      - "traefik.http.services.cloud-backend.loadbalancer.server.port=4002"
      - "traefik.http.routers.cloud-backend.middlewares=backend-headers"

  cloud_frontend:
    container_name: cloud_frontend
    image: docker.io/${DOCKER_USER}/cloud-frontend:latest
    environment:
      - NODE_ENV=production
      - PORT=3002
      - NEXT_PUBLIC_API_URL=https://api.cloud.tehkly.com
    depends_on:
      - cloud_backend
    restart: always
    networks:
      - cloud_network
      - proxy_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.cloud-frontend.rule=Host(`cloud.tehkly.com`)"
      - "traefik.http.routers.cloud-frontend.entrypoints=websecure"
      - "traefik.http.routers.cloud-frontend.tls.certresolver=le"
      - "traefik.http.services.cloud-frontend.loadbalancer.server.port=3002"
      - "traefik.http.routers.cloud-frontend.middlewares=frontend-headers"

volumes:
  cloud_postgres_data:
    driver: local
  cloud_uploads:
    driver: local

networks:
  cloud_network:
    driver: bridge
  proxy_network:
    external: true
    name: tehkly_proxy_network
